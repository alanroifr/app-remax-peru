<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>REMAX Perú</title>
  <style>
    :root { --azul: #003da5; --rojo: #dc1c2e; --fondo: #f4f6fb; --texto: #1b2333; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo); color: var(--texto);
      display: flex; flex-direction: column; justify-content: center; padding: 24px 16px;
      padding-top: calc(24px + env(safe-area-inset-top));
    }
    #logo { display: block; width: 70%; max-width: 280px; height: auto; margin: 0 auto 24px; }
    h1 { margin: 0 0 4px; font-size: 26px; color: var(--azul); text-align: center; }
    p.sub { margin: 0 0 32px; text-align: center; color: #5a6475; }
    a.boton {
      display: block; text-decoration: none; text-align: center; width: 100%; max-width: 420px; margin: 0 auto 16px; padding: 20px;
      border: 0; border-radius: 14px; font-size: 18px; font-weight: 600; color: #fff; cursor: pointer;
    }
    a.boton small { display: block; margin-top: 4px; font-size: 14px; font-weight: 400; opacity: .9; }
    #web { background: var(--azul); }
    #sigi { background: var(--rojo); }
  </style>
</head>
